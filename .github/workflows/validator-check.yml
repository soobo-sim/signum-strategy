name: Validator Auto-trigger

on:
  pull_request:
    types: [opened]
    branches:
      - main
      - 'release/v*'

jobs:
  trigger-validator:
    name: Post validator checklist
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: validator 검증 코멘트 게시
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const base = pr.base.ref;
            const title = pr.title;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `@github-copilot`,
                ``,
                `## Validator review requested`,
                ``,
                `**PR**: ${title}`,
                `**Branch**: \`${branch}\` → \`${base}\``,
                ``,
                `Please run each checklist item with actual commands and report results as a table comment on this PR.`,
                ``,
                `### Checklist`,
                `1. **[1] SSoT** — 수정된 개념(계산 로직, 정책)이 코드베이스에서 단 한 곳에만 존재하는가`,
                `2. **[2] 대칭성** — 롱/숏, trending/ranging 모두 동등하게 적용됐는가 (TrendLong↔TrendShort, BoxLong↔BoxShort)`,
                `3. **[3] 값·의미 일치** — 변수명/레이블이 실제 값과 일치하는가 (candle.close ≠ current_price 등)`,
                `4. **[4] 분기 클래스화** — \`if side=="buy"\` / \`if direction=="long"\` 분기가 메서드 내 2회 이상 없는가`,
                `5. **[5] Protocol/ABC** — 새 Policy 클래스가 \`core.strategy.contracts.*\` Protocol을 implements하는가`,
                `6. **[6] 의존성 격리** — DB import(AsyncSession/ORM), signum-engine 내부 import, 하드코드 API 키 없는가`,
                `7. **[7] 하드코드 금지** — 수치/URL/타임아웃 리터럴에 \`HARDCODE_OK\` 주석 없이 사용된 것이 없는가`,
                `8. **[8] Tests** — \`python -m pytest tests/ -m "not requires_api_key" --tb=short -q\` FAILED: 0`,
                ``,
                `### Commands`,
                `\`\`\`bash`,
                `# OOP 검증`,
                `grep -rn "if side\\|if direction\\|if trading_style" src/ --include="*.py" | grep -v "__pycache__"`,
                `grep -rn "class.*Protocol\\|class.*ABC\\|@abstractmethod" src/ --include="*.py" | grep -v "__pycache__"`,
                ``,
                `# 의존성 격리 확인`,
                `grep -rn "AsyncSession\\|from sqlalchemy" src/ --include="*.py" | grep -v "__pycache__"`,
                `grep -rn "from signum_engine\\." src/ --include="*.py" | grep -v "__pycache__"`,
                ``,
                `# 테스트`,
                `python -m pytest tests/ -m "not requires_api_key" --tb=short -q`,
                `ruff check src/ tests/`,
                `\`\`\``,
                ``,
                `### Report format`,
                `\`\`\``,
                `| # | Item | Result | Notes |`,
                `|---|------|--------|-------|`,
                `| 1 | SSoT | ✅/❌ | |`,
                `| 2 | 대칭성 | ✅/❌ | |`,
                `| 3 | 값·의미 일치 | ✅/❌ | |`,
                `| 4 | 분기 클래스화 | ✅/❌ | |`,
                `| 5 | Protocol/ABC | ✅/❌ | |`,
                `| 6 | 의존성 격리 | ✅/❌ | |`,
                `| 7 | 하드코드 금지 | ✅/❌ | |`,
                `| 8 | Tests | ✅/❌ | FAILED: N |`,
                `\`\`\``,
                ``,
                `**Summary**: ✅ All passed → Approve / ❌ Any failure → Request Changes`,
              ].join('\n'),
            });

name: Validator Auto-trigger

on:
  pull_request:
    types: [opened]
    branches:
      - main
      - 'release/v*'

jobs:
  trigger-validator:
    name: Post validator checklist
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: validator 검증 코멘트 게시
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const base = pr.base.ref;
            const title = pr.title;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `@github-copilot`,
                ``,
                `## Validator review requested`,
                ``,
                `**PR**: ${title}`,
                `**Branch**: \`${branch}\` → \`${base}\``,
                ``,
                `Please run each checklist item with actual commands and report results as a table comment on this PR.`,
                ``,
                `### Checklist`,
                `1. **[1] Protocol compliance** — all 4 ExchangeAdapter methods implemented`,
                `2. **[2] Isolation** — no DB imports, no signum-engine internal references`,
                `3. **[3] No hardcodes** — no URL/timeout literals, no direct os.getenv calls`,
                `4. **[4] Security** — no secret log exposure, input validation present`,
                `5. **[5] API correctness** — HMAC signature order, MARKET_BUY distinction, ERR-422 handling`,
                `6. **[6] Tests** — \`pytest -m "not requires_api_key"\` FAILED: 0`,
                ``,
                `### Report format`,
                `\`\`\``,
                `| # | Item | Result | Notes |`,
                `|---|------|--------|-------|`,
                `| 1 | Protocol compliance | ✅/❌ | |`,
                `| 2 | Isolation | ✅/❌ | |`,
                `| 3 | No hardcodes | ✅/❌ | |`,
                `| 4 | Security | ✅/❌ | |`,
                `| 5 | API correctness | ✅/❌ | |`,
                `| 6 | Tests | ✅/❌ | |`,
                `\`\`\``,
                ``,
                `**Summary**: ✅ All passed → Approve / ❌ Any failure → Request Changes`,
              ].join('\n'),
            });

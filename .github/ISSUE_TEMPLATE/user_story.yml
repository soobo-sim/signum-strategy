name: "📝 User Story"
description: "🔨 단일 PR로 구현 가능한 작업 단위 — Feature의 하위 구현 이슈"
title: "[US] "
labels:
  - type:user-story
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 User Story란?

        User Story는 **에이전트(또는 개발자)가 단일 PR로 처리하는 구현 단위**입니다.
        "누가 / 무엇을 원하는가 / 왜"를 중심으로 쓰면 에이전트가 목적을 정확히 이해하고 작업합니다.

        ```
        🏔️ Epic
          └── 📋 Feature   ← 상위 이슈
                └── 📝 User Story  ← 지금 작성하는 이슈 (PR 1개)
        ```

        > **작성 팁** — "As a [역할] / I want to [행동] / So that [비즈니스 가치]" 형식으로 쓰세요.
        >
        > | 항목 | 좋은 예 | 나쁜 예 |
        > |------|---------|---------|
        > | As a | Data Engineer | 개발자 (너무 막연) |
        > | So that | DB 없이 Mapper 단위 테스트를 작성할 수 있다 | 편하게 쓸 수 있다 |

  - type: input
    id: feature_issue
    attributes:
      label: "📋 상위 Feature Issue #"
      description: "이 User Story가 속하는 Feature 이슈 번호. Feature 이슈를 먼저 만들어야 합니다."
      placeholder: "예: #12"
    validations:
      required: true

  - type: input
    id: brd_goal
    attributes:
      label: "🎯 BRD 목표 연결 (Goal ID)"
      description: "이 작업이 기여하는 BRD Goal 번호. 상위 Feature와 동일하면 그대로 쓰세요."
      placeholder: "예: G1"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "📊 우선순위"
      description: "상위 Feature의 우선순위와 같게 설정하는 것이 기본입니다."
      options:
        - "P1 — 🔴 즉시 구현"
        - "P2 — 🟡 다음 단계"
        - "P3 — 🟢 검토 중"
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: "⚠️ 전제조건 (시작 전 반드시 확인)"
      description: "의존 이슈가 없으면 **없음 — 즉시 시작 가능** 으로 명시 (생략 금지)"
      placeholder: |
        - [ ] PR for #12 (US-01 제목) merged into main
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: "💬 User Story"
      description: |
        아래 형식으로 작성하세요:
        - **As a**: 이 기능을 쓰는 사람 (Data Engineer / Quant Developer / Operator)
        - **I want to**: 원하는 동작이나 기능 (코드 레벨 설명도 OK)
        - **So that**: 이로 인해 얻는 비즈니스·개발 가치 (단순 기술 설명 금지)
      placeholder: |
        **As a** Data Engineer,
        **I want to** app/domain/records.py에 CandleRecord 등 순수 Python dataclass를 정의하고 싶다,
        **So that** DB나 HTTP 없이도 Mapper / Store 단위 테스트를 작성할 수 있다.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ 인수 조건 (Acceptance Criteria)"
      description: |
        테스트로 확인할 수 있는 조건을 번호 목록으로 작성하세요.
        모호한 표현 금지 — 명확한 Pass / Fail 기준이어야 합니다.
        예) ✅ "from app.domain.records import CandleRecord 가 오류 없이 실행된다"
            ❌ "domain 타입이 잘 작동한다"
      placeholder: |
        - AC1: CandleRecord(pair="btc_jpy", timeframe="1h", ...) 로 직접 생성된다.
        - AC2: from app.domain.records import CandleRecord 가 오류 없이 실행된다.
        - AC3: domain/ 내 어떤 파일도 sqlalchemy import 없음 (grep 0건 확인).
    validations:
      required: true

  - type: textarea
    id: lld_reference
    attributes:
      label: "LLD 참조 (LLD.md 있는 경우 필수, 없으면 생략)"
      placeholder: |
        - Protocol: `CandleStoreProtocol` (`app/protocols/candle_store.py`)
        - 핵심 메서드: `store(candle: CandleRecord) -> None`
        - LLD DoD: CandleStoreProtocol 구현체가 모든 AC를 통과해야 한다

  - type: textarea
    id: background
    attributes:
      label: "🔍 배경 / 구현 힌트 (선택)"
      description: "에이전트에게 필요한 추가 컨텍스트, 주의사항, 참고 파일을 알려주세요."
      placeholder: |
        - HLD 참조: docs/20260627_01_data-abstraction-refactor/signum-data_HLD.md §4.1
        - 의존 규칙: domain/ 은 sqlalchemy, fastapi, httpx import 절대 금지
        - 참고 파일: app/models/ (현재 ORM 모델 위치 — 이전 대상)
    validations:
      required: false

  - type: checkboxes
    id: dod
    attributes:
      label: "🏁 Definition of Done"
      description: "PR 머지 전 모두 체크되어야 합니다."
      options:
        - label: "코드 구현 완료 및 lint / mypy 통과"
        - label: "단위 테스트 작성 완료 (pytest tests/unit/ 통과)"
        - label: "인수 조건 전체 검증 완료 (수동 또는 자동화)"
        - label: "PR 리뷰 완료 및 main 머지"

name: User Story
description: 에이전트가 단일 PR로 처리할 수 있는 User Story.
title: "[US] "
labels:
  - type:user-story
body:
  - type: input
    id: feature_issue
    attributes:
      label: Feature Issue #
      placeholder: "예: #12"
    validations:
      required: true

  - type: input
    id: brd_goal
    attributes:
      label: BRD 목표 (Goal ID)
      placeholder: "예: G1"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P1 — 즉시 구현
        - P2 — 다음 단계
        - P3 — 검토 중
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: "⚠️ 전제조건 (시작 전 반드시 확인)"
      description: "의존 이슈가 없으면 **없음 — 즉시 시작 가능** 으로 명시 (생략 금지)"
      placeholder: |
        - [ ] PR for #12 (US-01 제목) merged into main
    validations:
      required: true

  - type: textarea
    id: background_why
    attributes:
      label: 배경 (왜 이 스토리가 필요한가)
      description: "지금 무슨 불편이 있고, 이 스토리가 없으면 어떤 문제가 지속되는지 1~2문장으로 설명"
      placeholder: "현재 수집기 상태를 확인하려면 로그를 직접 검색해야 해서 시간이 걸린다."
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "As a / I want to / So that 형식으로 작성"
      placeholder: |
        **As a** Data Engineer,
        **I want to** POST /api/candles/backfill을 호출해서 누락 캔들을 채우고 싶다,
        **So that** 전략 감지에 필요한 4H 캔들이 충분히 확보된다.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 인수 조건 (Acceptance Criteria)
      placeholder: |
        - AC1: 누락 구간이 정확히 탐지된다
        - AC2: 백필된 캔들이 DB에 저장된다
        - AC3: 이미 존재하는 캔들은 덮어쓰지 않는다
    validations:
      required: true

  - type: textarea
    id: lld_reference
    attributes:
      label: LLD 참조 (LLD.md 있는 경우 필수, 없으면 생략)
      placeholder: |
        - Protocol: `CollectorProtocol` (`app/protocols/collector.py`)
        - 핵심 메서드: `fetch(pair: str) -> list[Candle]`
        - LLD DoD: CollectorProtocol 구현체가 모든 AC를 통과해야 한다

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: 코드 구현 및 단위 테스트 완료
        - label: 인수 조건 검증 완료 (수동 또는 자동화 테스트)
        - label: PR 리뷰 및 main 머지 완료

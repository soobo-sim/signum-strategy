[project]
name = "signum-strategy"
version = "0.1.0"
description = "Concrete trading strategy implementations for signum-engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "soobo-sim" }
]

dependencies = [
  "signum-engine @ git+https://github.com/soobo-sim/signum-engine.git@main",
  "signum-adapters @ git+https://github.com/soobo-sim/signum-adapters.git@main",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signum_strategy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "requires_api_key: tests that require real API credentials",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
